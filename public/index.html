<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiPriceAlert Terminal — Live Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          cyber: {
            bg: '#040d08',
            card: '#08170f',
            cardBorder: 'rgba(0, 255, 136, 0.25)',
            neonGreen: '#00ff88',
            neonGold: '#ffcc00',
            neonRed: '#ff2d55'
          }
        }
      }
    }
  };
</script>
<style>
  body {
    background-color: #040d08;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .neon-glow-green { box-shadow: 0 0 15px rgba(0, 255, 136, 0.35); }
  .neon-glow-gold { text-shadow: 0 0 12px rgba(255, 204, 0, 0.6); }
  .neon-glow-card { box-shadow: 0 0 20px rgba(0, 255, 136, 0.08); }
  .neon-border { border: 1px solid rgba(0, 255, 136, 0.22); }
  .glass-card {
    background: linear-gradient(145deg, rgba(8, 23, 15, 0.85), rgba(4, 15, 10, 0.95));
    backdrop-filter: blur(12px);
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(0, 255, 136, 0.3); border-radius: 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body class="min-h-screen pb-28 text-slate-100 antialiased">

<!-- TOP BAR -->
<header class="sticky top-0 z-50 glass-card border-b border-emerald-500/20 px-4 py-3">
  <div class="max-w-md mx-auto flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="relative">
        <div class="w-11 h-11 rounded-xl bg-slate-950 border border-emerald-500/50 flex items-center justify-center neon-glow-green">
          <span class="text-2xl">🤖</span>
        </div>
        <span id="live-dot" class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-slate-600 rounded-full border-2 border-[#040d08]"></span>
      </div>
      <div>
        <div class="flex items-center space-x-1.5">
          <h1 class="font-bold text-sm text-white tracking-wide">@AiPriceAlertBot</h1>
          <span class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-1.5 rounded font-mono font-bold">TERMINAL</span>
        </div>
        <p class="text-[11px] text-emerald-400/90 font-mono flex items-center mt-0.5">
          <i class="fa-solid fa-signal text-[9px] mr-1 text-emerald-400"></i>
          PRICE READINGS: <span id="reading-count" class="font-bold text-emerald-300 ml-1">—</span>
        </p>
      </div>
    </div>
    <button onclick="triggerToast('Prices are checked automatically by the bot.')"
            class="w-9 h-9 rounded-xl bg-emerald-950/40 border border-emerald-500/30 flex items-center justify-center text-emerald-400 hover:bg-emerald-800/30 transition">
      <i class="fa-solid fa-bell text-xs"></i>
    </button>
  </div>
</header>

<main class="max-w-md mx-auto px-3.5 pt-3.5 space-y-3.5">

  <!-- SEARCH -->
  <section class="glass-card rounded-2xl p-3.5 neon-border neon-glow-card">
    <div class="flex items-center justify-between mb-2">
      <label class="text-[11px] font-mono uppercase tracking-wider text-emerald-400 font-semibold flex items-center">
        <i class="fa-solid fa-crosshairs mr-1.5"></i> Find a product's price history
      </label>
      <span class="text-[10px] text-slate-400 font-mono">Amazon · Flipkart</span>
    </div>
    <div class="flex gap-2">
      <div class="relative flex-1">
        <input type="text" id="url-input" placeholder="Paste a product link or id"
               class="w-full bg-[#040d08] border border-emerald-500/40 rounded-xl pl-3 pr-8 py-2 text-xs text-emerald-200 placeholder-emerald-800 focus:outline-none focus:border-emerald-400 font-mono truncate">
        <button onclick="clearInput()" class="absolute right-2.5 top-2.5 text-slate-500 hover:text-emerald-400 text-xs">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>
      <button onclick="runSearch()" class="bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black px-4 py-2 rounded-xl text-xs transition flex items-center justify-center space-x-1 neon-glow-green shrink-0">
        <span id="btn-text">CHECK</span>
        <i class="fa-solid fa-bolt text-[10px]"></i>
      </button>
    </div>
  </section>

  <!-- EMPTY / ERROR STATE -->
  <section id="note" class="glass-card rounded-2xl p-4 neon-border hidden">
    <p id="note-text" class="text-[11px] font-mono text-slate-300"></p>
  </section>

  <!-- PRODUCT -->
  <section id="result" class="hidden space-y-3.5">
    <section class="glass-card rounded-2xl p-4 neon-border relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-28 h-28 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="flex items-start space-x-3.5">
        <div class="relative w-16 h-16 rounded-xl bg-slate-950 border border-emerald-500/30 p-1.5 shrink-0 flex items-center justify-center">
          <img id="p-img" alt="" class="w-full h-full object-contain rounded-lg hidden">
          <i id="p-img-fallback" class="fa-solid fa-box text-emerald-700 text-xl"></i>
          <span id="p-market" class="absolute -top-1.5 -left-1.5 bg-amber-500 text-slate-950 text-[9px] font-black font-mono px-1.5 rounded-md uppercase shadow-md">—</span>
        </div>

        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <span id="p-id" class="text-[10px] font-mono text-emerald-400/80 truncate"></span>
            <span id="p-stock" class="text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border shrink-0"></span>
          </div>
          <h2 id="p-title" class="text-sm font-bold text-white truncate mt-0.5"></h2>

          <div class="mt-1.5 flex items-baseline space-x-2">
            <span class="text-[10px] font-mono text-slate-400">CURRENT</span>
            <span id="p-price" class="text-xl font-extrabold text-[#ffcc00] font-mono neon-glow-gold">—</span>
          </div>

          <div class="flex items-center space-x-2 text-[11px] font-mono mt-0.5 flex-wrap">
            <span id="p-mrp-wrap" class="text-slate-400 hidden">MRP: <span id="p-mrp" class="line-through text-slate-500"></span></span>
            <span id="p-off" class="text-emerald-400 font-bold bg-emerald-500/10 px-1 rounded border border-emerald-500/20 hidden"></span>
            <span id="p-prev" class="text-slate-400"></span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-emerald-500/20 text-center font-mono">
        <div class="bg-slate-950/60 border border-emerald-500/15 rounded-xl p-2">
          <div class="text-[9px] text-slate-400 uppercase tracking-wide">Highest</div>
          <div id="stat-high" class="text-xs font-bold text-red-400 mt-0.5">—</div>
        </div>
        <div class="bg-slate-950/60 border border-emerald-500/15 rounded-xl p-2">
          <div class="text-[9px] text-slate-400 uppercase tracking-wide">Average</div>
          <div id="stat-avg" class="text-xs font-bold text-amber-300 mt-0.5">—</div>
        </div>
        <div class="bg-slate-950/60 border border-emerald-500/15 rounded-xl p-2">
          <div class="text-[9px] text-slate-400 uppercase tracking-wide">Lowest</div>
          <div id="stat-low" class="text-xs font-bold text-emerald-400 mt-0.5">—</div>
        </div>
      </div>

      <div class="mt-2 text-[10px] text-slate-400 font-mono text-right flex items-center justify-end">
        <i class="fa-regular fa-clock mr-1 text-emerald-400/70"></i>
        Updated: <span id="last-update" class="ml-1 text-slate-300">—</span>
      </div>
    </section>

    <!-- BUYING METER -->
    <section class="glass-card rounded-2xl p-3.5 neon-border">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-xs font-bold text-white font-mono flex items-center">
          <i class="fa-solid fa-gauge-high text-emerald-400 mr-1.5"></i> Should you buy at this price?
        </h3>
        <span id="verdict-badge" class="text-[10px] px-1.5 py-0.5 rounded font-mono font-bold border">—</span>
      </div>

      <div class="relative my-3">
        <div class="h-2.5 w-full rounded-full bg-gradient-to-r from-red-500 via-amber-400 to-emerald-400 p-0.5 relative">
          <div id="meter-pointer" class="absolute -top-1.5 w-5 h-5 bg-slate-950 border-2 border-emerald-400 rounded-full shadow-lg transition-all duration-500 left-1/2 flex items-center justify-center">
            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span>
          </div>
        </div>
        <div class="flex justify-between text-[10px] font-mono text-slate-400 mt-2 px-0.5 font-semibold">
          <span id="lbl-skip">Skip</span>
          <span id="lbl-wait">Wait</span>
          <span id="lbl-okay">Okay</span>
          <span id="lbl-yes">Yes!</span>
        </div>
      </div>

      <p id="meter-desc" class="text-[11px] text-slate-300 font-mono bg-slate-950/60 border border-emerald-500/20 p-2.5 rounded-xl leading-relaxed"></p>
    </section>

    <!-- CHART -->
    <section class="glass-card rounded-2xl p-3.5 neon-border">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-xs font-bold text-white font-mono flex items-center">
          <i class="fa-solid fa-chart-area text-emerald-400 mr-1.5"></i> Price History Graph
        </h3>
        <div class="flex space-x-2 text-[10px] font-mono">
          <span class="flex items-center text-slate-400"><span class="w-2 h-2 rounded-full bg-[#ff2d55] mr-1"></span>MRP</span>
          <span class="flex items-center text-emerald-400"><span class="w-2 h-2 rounded-full bg-emerald-400 mr-1"></span>Price</span>
        </div>
      </div>

      <div class="relative h-52 w-full bg-[#040d08] border border-emerald-500/20 rounded-xl p-2 my-2">
        <canvas id="priceHistoryChart"></canvas>
      </div>

      <div class="flex items-center justify-between gap-1 mt-3 font-mono" id="filters">
        <button onclick="filterGraph('all', this)" data-range="all" class="filter-btn flex-1 py-1 bg-emerald-400 text-slate-950 font-black rounded-lg text-[10px] transition text-center shadow">All</button>
        <button onclick="filterGraph('1y', this)" data-range="1y" class="filter-btn flex-1 py-1 bg-slate-950 border border-emerald-500/30 text-emerald-400 rounded-lg text-[10px] transition text-center hover:bg-emerald-950">1Y</button>
        <button onclick="filterGraph('6m', this)" data-range="6m" class="filter-btn flex-1 py-1 bg-slate-950 border border-emerald-500/30 text-emerald-400 rounded-lg text-[10px] transition text-center hover:bg-emerald-950">6M</button>
        <button onclick="filterGraph('3m', this)" data-range="3m" class="filter-btn flex-1 py-1 bg-slate-950 border border-emerald-500/30 text-emerald-400 rounded-lg text-[10px] transition text-center hover:bg-emerald-950">3M</button>
        <button onclick="filterGraph('1m', this)" data-range="1m" class="filter-btn flex-1 py-1 bg-slate-950 border border-emerald-500/30 text-emerald-400 rounded-lg text-[10px] transition text-center hover:bg-emerald-950">1M</button>
      </div>
    </section>

    <!-- RECENT DROPS -->
    <section class="glass-card rounded-2xl p-3.5 neon-border">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-xs font-bold text-white font-mono flex items-center">
          <i class="fa-solid fa-receipt text-emerald-400 mr-1.5"></i> Recent Price Drops
        </h3>
        <span class="text-[9px] font-mono bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-1.5 py-0.5 rounded">FROM THIS HISTORY</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-[11px] font-mono">
          <thead>
            <tr class="border-b border-emerald-500/20 text-emerald-400/70 text-[9px]">
              <th class="pb-1.5">WHEN</th>
              <th class="pb-1.5">PRICE</th>
              <th class="pb-1.5 text-right">DROPPED</th>
            </tr>
          </thead>
          <tbody id="drops-table-body" class="divide-y divide-emerald-500/10 text-slate-300"></tbody>
        </table>
      </div>
    </section>
  </section>

  <!-- CATEGORY-AWARE TRENDING DEALS
       The heading and the contents both follow the product being viewed. The
       category is inferred from the product title server-side and handed back
       with the price history, so nothing here has to guess. -->
  <section id="trending" class="hidden mt-6">
    <div class="flex items-center justify-between mb-2.5">
      <h2 class="text-sm font-black text-emerald-300 uppercase tracking-wider">
        <i class="fa-solid fa-fire mr-1.5"></i><span id="trending-title">Trending Deals</span>
      </h2>
      <span id="trending-note" class="text-[10px] text-slate-500"></span>
    </div>
    <div id="trending-grid" class="grid grid-cols-2 gap-2.5"></div>
  </section>

</main>

<!-- STICKY BOTTOM -->
<footer id="bottom" class="fixed bottom-0 left-0 right-0 bg-[#040d08]/90 backdrop-blur-lg border-t border-emerald-500/30 p-3 z-50 hidden">
  <div class="max-w-md mx-auto flex items-center gap-2.5">
    <button onclick="shareLink()" class="w-11 h-11 rounded-xl bg-slate-950 border border-emerald-500/40 flex items-center justify-center text-emerald-400 hover:bg-emerald-900/40 transition shrink-0">
      <i class="fa-solid fa-share-nodes text-sm"></i>
    </button>
    <a id="buyBtn" href="#" target="_blank" rel="noopener"
       class="flex-1 bg-gradient-to-r from-blue-600 via-teal-400 to-emerald-400 hover:from-blue-500 hover:to-emerald-300 text-slate-950 font-black py-3 px-4 rounded-xl text-center text-xs uppercase tracking-wider transition neon-glow-green flex items-center justify-center space-x-2">
      <span id="buyBtn-label">Buy Now</span>
      <i class="fa-solid fa-cart-shopping text-xs"></i>
    </a>
  </div>
</footer>

<script>
/* ---------------------------------------------------------------------------
   Everything here is driven by the REAL data from /api/track?id=… — no
   placeholder numbers. Where we do not have a figure, the UI says so rather
   than inventing one.
   --------------------------------------------------------------------------- */

var API = '/api/track?id=';
var state = { history: [], currency: 'INR', product: null, chart: null, range: 'all' };
var $ = function (id) { return document.getElementById(id); };

function triggerToast(msg) {
  var old = $('custom-toast');
  if (old) old.remove();
  var t = document.createElement('div');
  t.id = 'custom-toast';
  t.className = 'fixed top-16 left-1/2 -translate-x-1/2 z-50 glass-card border border-emerald-400 text-emerald-300 text-xs font-mono px-3.5 py-2 rounded-xl shadow-2xl flex items-center space-x-2';
  t.innerHTML = '<i class="fa-solid fa-bolt text-emerald-400"></i><span>' + msg + '</span>';
  document.body.appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 300); }, 2500);
}

/* --- currency -------------------------------------------------------------- */
var CURRENCY_SYMBOLS = { INR: '₹', USD: '$', GBP: '£', EUR: '€', AED: 'AED ' };
function money(n, cur) {
  if (n == null || isNaN(n)) return '—';
  var code = String(cur == null ? '' : cur).trim().toUpperCase();
  var sym = CURRENCY_SYMBOLS[code];
  if (sym == null) sym = '₹';
  return sym + Number(n).toLocaleString('en-IN');
}
function stamp(ms) {
  if (!ms) return '—';
  try {
    return new Date(ms).toLocaleString('en-IN',
      { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return '—'; }
}
function storeName(m) {
  if (m === 'amazon') return 'Amazon';
  if (m === 'flipkart') return 'Flipkart';
  return m ? (m.charAt(0).toUpperCase() + m.slice(1)) : 'Product';
}
function show(el) { if (el) el.classList.remove('hidden'); }
function hide(el) { if (el) el.classList.add('hidden'); }
function note(msg) { $('note-text').textContent = msg; show($('note')); }

/* --- id from a link or an id ---------------------------------------------- */
function idFromInput(raw) {
  var s = String(raw || '').trim();
  if (!s) return null;
  var m = s.match(/[?&]id=([a-z]+_[A-Za-z0-9]+)/i);
  if (m) return m[1];
  if (/^[a-z]+_[A-Za-z0-9]+$/i.test(s)) return s;
  return null;
}
function idFromQuery() {
  try {
    return new URLSearchParams(location.search).get('id');
  } catch (e) { return null; }
}

/* --- the readings we can actually stand behind ---------------------------- */
/* A reading above the MRP is impossible; one far below it is an exchange offer
   or an EMI instalment. One such reading drags the average and the high, which
   then pushes the meter to "Yes" for a price that just rose. */
function usableReadings(hist, mrp) {
  var ok = hist.filter(function (h) {
    if (typeof h.price !== 'number' || !isFinite(h.price) || h.price <= 0) return false;
    if (mrp == null) return true;
    return h.price <= mrp * 1.02 && h.price >= mrp * 0.4;
  });
  return ok.length ? ok : hist;
}

/* --- render --------------------------------------------------------------- */
function render(id, p, hist) {
  var isIndianStore = p.marketplace === 'amazon' || p.marketplace === 'flipkart';
  var cur = isIndianStore ? 'INR' : (p.currency || 'INR');
  state.currency = cur;
  state.product = p;

  var mrpRef = (p.mrp != null && p.mrp > 0) ? p.mrp : null;
  var usable = usableReadings(hist, mrpRef);
  state.history = usable;

  show($('result'));
  show($('bottom'));
  hide($('note'));

  /* image */
  if (p.imageUrl) {
    $('p-img').src = p.imageUrl;
    $('p-img').onerror = function () { hide($('p-img')); show($('p-img-fallback')); };
    show($('p-img')); hide($('p-img-fallback'));
  } else {
    hide($('p-img')); show($('p-img-fallback'));
  }

  $('p-market').textContent = storeName(p.marketplace);
  $('p-title').textContent = p.title || p.productId || id;
  $('p-id').textContent = p.productId ? (p.productId) : '';

  var last = p.lastPrice != null ? p.lastPrice : (usable.length ? usable[usable.length - 1].price : null);
  $('p-price').textContent = money(last, cur);

  /* stock — only claim a state when the data states one */
  var stock = $('p-stock');
  if (p.inStock === false) {
    stock.textContent = 'OUT OF STOCK';
    stock.className = 'text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border shrink-0 bg-red-500/20 text-red-400 border-red-500/40';
  } else if (p.inStock === true) {
    stock.textContent = 'IN STOCK';
    stock.className = 'text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border shrink-0 bg-emerald-500/20 text-emerald-400 border-emerald-500/40';
  } else {
    stock.textContent = 'STOCK UNKNOWN';
    stock.className = 'text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border shrink-0 bg-slate-500/20 text-slate-300 border-slate-500/40';
  }

  /* MRP and the previous price */
  if (mrpRef != null && last != null && mrpRef > last) {
    $('p-mrp').textContent = money(mrpRef, cur);
    show($('p-mrp-wrap'));
    $('p-off').textContent = '▼ ' + Math.round(((mrpRef - last) / mrpRef) * 100) + '% OFF';
    show($('p-off'));
  } else {
    hide($('p-mrp-wrap')); hide($('p-off'));
  }

  var prev = null;
  var seq = usable.map(function (h) { return h.price; });
  for (var i = seq.length - 2; i >= 0; i--) {
    if (seq[i] !== last) { prev = seq[i]; break; }
  }
  $('p-prev').innerHTML = (prev != null && last != null)
    ? ('Prev: <span class="text-slate-300">' + money(prev, cur) + '</span> <span class="' +
       (last < prev ? 'text-emerald-400' : 'text-red-400') + '">' +
       (last < prev ? '▼' : '▲') + ' ' + Math.round((Math.abs(last - prev) / prev) * 100) + '%</span>')
    : '';

  /* stats, from the readings we trust */
  var prices = seq;
  var low = prices.length ? Math.min.apply(null, prices) : null;
  var high = prices.length ? Math.max.apply(null, prices) : null;
  var avg = prices.length ? Math.round(prices.reduce(function (a, b) { return a + b; }, 0) / prices.length) : null;
  $('stat-low').textContent = money(low, cur);
  $('stat-high').textContent = money(high, cur);
  $('stat-avg').textContent = money(avg, cur);

  $('last-update').textContent = p.lastCheckedAt ? stamp(p.lastCheckedAt) : 'not yet checked';
  $('reading-count').textContent = prices.length || '0';
  $('live-dot').className = 'absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full border-2 border-[#040d08] ' +
    (prices.length ? 'bg-emerald-400 animate-pulse' : 'bg-slate-600');

  /* the verdict */
  var pointer = $('meter-pointer'), desc = $('meter-desc'), badge = $('verdict-badge');
  ['skip', 'wait', 'okay', 'yes'].forEach(function (k) { $('lbl-' + k).className = ''; });

  function verdict(label, tone, text) {
    badge.textContent = label;
    badge.className = 'text-[10px] px-1.5 py-0.5 rounded font-mono font-bold border ' + tone;
    desc.innerHTML = text;
  }

  if (prices.length < 2 || low == null || high == null) {
    pointer.style.left = '50%';
    verdict('NO DATA', 'bg-slate-500/20 text-slate-300 border-slate-500/40',
      'Not enough price history yet. A buy verdict appears once a few readings have been recorded.');
  } else if (low === high) {
    pointer.style.left = '62%';
    verdict('FLAT', 'bg-slate-500/20 text-slate-300 border-slate-500/40',
      'Every reading so far is <strong class="text-amber-300">' + money(last, cur) +
      '</strong>. There has been no movement, so there is nothing to gain by waiting.');
  } else {
    var pos = (last - low) / (high - low);
    pos = Math.max(0, Math.min(1, pos));
    /* The bar runs Skip -> Wait -> Okay -> Yes, so a price at its LOW sits on the
       right. The pointer is therefore inverted. */
    pointer.style.left = ((1 - pos) * 100) + '%';
    var aboveLow = Math.round(((last - low) / low) * 100);
    var rose = (prev != null && last != null && last > prev);

    if (rose) {
      /* A price that just went UP is never "a reasonable time to buy". */
      var pctUp = Math.round(((last - prev) / prev) * 100);
      $('lbl-wait').className = 'text-amber-300 font-bold uppercase tracking-wider';
      verdict('WAIT', 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        '<i class="fa-solid fa-triangle-exclamation text-amber-300 mr-1"></i>' +
        'The price just went <strong class="text-red-400">UP ' + pctUp + '%</strong> (from ' +
        money(prev, cur) + ' to ' + money(last, cur) + '). It is ' + aboveLow +
        '% above the lowest recorded (<strong class="text-emerald-400">' + money(low, cur) +
        '</strong>). Waiting for it to come back down is the sensible move.');
    } else if (pos <= 0.15) {
      $('lbl-yes').className = 'text-emerald-400 font-bold uppercase tracking-wider';
      verdict('BEST TIME', 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        '<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i>The current price is within ' +
        aboveLow + '% of the lowest recorded (<strong class="text-amber-300">' + money(low, cur) +
        '</strong>). This is about as good as it has been.');
    } else if (pos <= 0.4) {
      $('lbl-okay').className = 'text-emerald-400 font-bold uppercase tracking-wider';
      verdict('OKAY', 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        'The current price is ' + aboveLow + '% above the lowest recorded (<strong class="text-amber-300">' +
        money(low, cur) + '</strong>). Closer to the low than the high, so buying now is reasonable.');
    } else if (pos <= 0.75) {
      $('lbl-wait').className = 'text-amber-300 font-bold uppercase tracking-wider';
      verdict('WAIT', 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        'The current price sits ' + aboveLow + '% above the lowest recorded (<strong class="text-amber-300">' +
        money(low, cur) + '</strong>). Not a bad price, but waiting may get you closer to the low.');
    } else {
      $('lbl-skip').className = 'text-red-400 font-bold uppercase tracking-wider';
      verdict('SKIP', 'bg-red-500/20 text-red-400 border-red-500/40',
        'The current price is near the highest recorded (<strong class="text-red-400">' + money(high, cur) +
        '</strong>) and ' + aboveLow + '% above the low. Waiting for a drop is likely to pay off.');
    }
  }

  /* buy buttons */
  var buy = p.affiliateUrl || p.cleanUrl || '#';
  $('buyBtn').href = buy;
  $('buyBtn-label').textContent = 'Buy @ ' + storeName(p.marketplace).toLowerCase() + '.com';

  populateDrops(usable, cur);
  buildChart(usable, mrpRef, cur);
}

/* --- recent drops, derived from the real history --------------------------- */
function populateDrops(hist, cur) {
  var body = $('drops-table-body');
  var drops = [];
  for (var i = 1; i < hist.length && drops.length < 8; i++) {
    var a = hist[i - 1].price, b = hist[i].price;
    if (typeof a === 'number' && typeof b === 'number' && b < a) {
      drops.push({ t: hist[i].t, price: b, saved: a - b });
    }
  }
  if (!drops.length) {
    body.innerHTML = '<tr><td colspan="3" class="py-2 text-slate-500">No price drops recorded yet.</td></tr>';
    return;
  }
  body.innerHTML = drops.reverse().map(function (d) {
    return '<tr>' +
      '<td class="py-2 text-slate-400">' + stamp(d.t) + '</td>' +
      '<td class="py-2 font-bold text-white">' + money(d.price, cur) + '</td>' +
      '<td class="py-2 text-right font-bold text-emerald-300">−' + money(d.saved, cur) + '</td>' +
      '</tr>';
  }).join('');
}

/* --- the chart ------------------------------------------------------------- */
function chartPoints() {
  var hist = state.history;
  var cur = state.currency;
  var range = state.range;
  if (range !== 'all') {
    var days = { '1y': 365, '6m': 182, '3m': 91, '1m': 30 }[range] || 0;
    var cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
    hist = hist.filter(function (h) { return h.t && h.t >= cutoff; });
    if (!hist.length) hist = state.history;
  }
  return {
    labels: hist.map(function (h) { return stamp(h.t).split(',')[0]; }),
    prices: hist.map(function (h) { return h.price; }),
    cur: cur
  };
}

function buildChart(hist, mrp, cur) {
  var canvas = $('priceHistoryChart');
  if (!canvas || !window.Chart) return;
  if (state.chart) { state.chart.destroy(); state.chart = null; }

  var pts = chartPoints();
  var ctx = canvas.getContext('2d');
  var gradient = ctx.createLinearGradient(0, 0, 0, 200);
  gradient.addColorStop(0, 'rgba(0, 255, 136, 0.35)');
  gradient.addColorStop(1, 'rgba(0, 255, 136, 0.0)');

  var datasets = [];
  if (mrp != null) {
    datasets.push({
      label: 'MRP',
      data: pts.labels.map(function () { return mrp; }),
      borderColor: '#ff2d55',
      borderDash: [4, 4],
      borderWidth: 1.5,
      pointRadius: 0,
      fill: false
    });
  }
  datasets.push({
    label: 'Price',
    data: pts.prices,
    borderColor: '#00ff88',
    backgroundColor: gradient,
    borderWidth: 2,
    fill: true,
    tension: 0.25,
    pointBackgroundColor: '#00ff88',
    pointBorderColor: '#040d08',
    pointRadius: pts.prices.length > 60 ? 0 : 3
  });

  state.chart = new Chart(ctx, {
    type: 'line',
    data: { labels: pts.labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#08170f',
          titleColor: '#00ff88',
          bodyColor: '#ffffff',
          borderColor: 'rgba(0, 255, 136, 0.4)',
          borderWidth: 1,
          callbacks: {
            label: function (c) { return c.dataset.label + ': ' + money(c.parsed.y, pts.cur); }
          }
        }
      },
      scales: {
        x: { grid: { color: 'rgba(0, 255, 136, 0.05)' }, ticks: { color: '#64748b', font: { size: 9, family: 'monospace' }, maxTicksLimit: 6 } },
        y: { grid: { color: 'rgba(0, 255, 136, 0.05)' }, ticks: { color: '#64748b', font: { size: 9, family: 'monospace' }, callback: function (v) { return money(v, pts.cur); } } }
      }
    }
  });
}

function filterGraph(period, btn) {
  state.range = period;
  document.querySelectorAll('.filter-btn').forEach(function (b) {
    b.className = 'filter-btn flex-1 py-1 bg-slate-950 border border-emerald-500/30 text-emerald-400 rounded-lg text-[10px] transition text-center hover:bg-emerald-950';
  });
  if (btn) btn.className = 'filter-btn flex-1 py-1 bg-emerald-400 text-slate-950 font-black rounded-lg text-[10px] transition text-center shadow';
  var p = state.product;
  buildChart(state.history, (p && p.mrp != null && p.mrp > 0) ? p.mrp : null, state.currency);
}

/* --- load ------------------------------------------------------------------ */
function load(id) {
  hide($('note'));
  return fetch(API + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) {
        hide($('result')); hide($('bottom')); hide($('trending'));
        note(d && d.error === 'not_found'
          ? 'No product with that id. Open this page from the bot’s Price History button.'
          : 'Could not load that product just now. Please try again.');
        return;
      }
      render(id, d.product, Array.isArray(d.history) ? d.history : []);
      // Deals that match what this product IS, not a generic list.
      renderDeals(d.product.category, d.product.categoryLabel, d.product.categoryConfidence);
    })
    .catch(function () {
      hide($('result')); hide($('bottom')); hide($('trending'));
      note('Could not load the price history just now. Please try again.');
    });
}

function runSearch() {
  var id = idFromInput($('url-input').value) || idFromQuery();
  if (!id) {
    triggerToast('Paste a product link, or an id like amazon_B0G81TPT89.');
    return;
  }
  $('btn-text').innerText = 'WAIT…';
  history.replaceState(null, '', '/?id=' + encodeURIComponent(id));
  load(id).then(function () { $('btn-text').innerText = 'CHECK'; });
}
function clearInput() { $('url-input').value = ''; }
function shareLink() {
  var url = location.href;
  if (navigator.share) { navigator.share({ url: url }).catch(function () {}); return; }
  if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function () { triggerToast('Link copied'); }); return; }
  triggerToast(url);
}

/**
 * Trending deals for the category of the product being viewed.
 *
 * The category comes from the server with the price history — inferred from the
 * product title — so this function never guesses. If the product has no
 * confident category, the general feed is shown under its normal heading rather
 * than a heading that would be a lie.
 */
var DEALS_API = '/api/deals?dryRun=1&limit=6';
var CATEGORY_HEADINGS = {
  mobile: 'Trending Mobile Deals',
  electronics: 'Trending Electronics Deals',
  appliances: 'Trending Appliance Deals',
  fashion: 'Trending Fashion Deals',
  home: 'Trending Home Deals',
  beauty: 'Trending Beauty Deals'
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderDeals(category, label, confidence) {
  var section = $('trending');
  var grid = $('trending-grid');
  if (!section || !grid) return;

  // Below this we are guessing, and a wrong heading is worse than a general one.
  var confident = category && category !== 'other' && (confidence === undefined || confidence >= 0.5);
  var q = confident ? DEALS_API + '&category=' + encodeURIComponent(category) : DEALS_API;
  $('trending-title').innerText =
    confident && CATEGORY_HEADINGS[category] ? CATEGORY_HEADINGS[category] : 'Trending Deals';

  fetch(q)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var deals = (d && Array.isArray(d.deals) ? d.deals : []).filter(function (x) {
        return x && x.title && x.price != null;
      });
      if (!deals.length) { hide(section); return; }
      grid.innerHTML = deals.slice(0, 6).map(function (x) {
        var img = x.imageUrl
          ? '<img src="' + esc(x.imageUrl) + '" alt="" loading="lazy" class="w-full h-24 object-contain bg-slate-950 rounded-lg mb-2" onerror="this.style.display=\'none\'">'
          : '<div class="w-full h-24 bg-slate-950 rounded-lg mb-2"></div>';
        var pct = x.discount ? '<span class="text-[10px] font-black text-amber-300">' + Math.round(x.discount) + '% OFF</span>' : '';
        return (
          '<a href="' + esc(x.url || x.affiliateUrl || '#') + '" target="_blank" rel="noopener" ' +
          'class="block bg-slate-900/70 border border-emerald-500/20 rounded-xl p-2.5 hover:border-emerald-400/50 transition">' +
          img +
          '<div class="text-[11px] text-slate-200 leading-snug line-clamp-2 h-8 overflow-hidden">' + esc(x.title) + '</div>' +
          '<div class="flex items-center justify-between mt-1.5">' +
          '<span class="text-xs font-black text-emerald-300">₹' + Number(x.price).toLocaleString('en-IN') + '</span>' + pct +
          '</div></a>'
        );
      }).join('');
      $('trending-note').innerText = confident ? 'based on this product' : '';
      show(section);
    })
    .catch(function () { hide(section); });
}

(function start() {
  var id = idFromQuery();
  if (id) { $('url-input').value = id; load(id); }
  else note('Paste a product link or tap Check. Supported: Amazon and Flipkart.');
})();
</script>
